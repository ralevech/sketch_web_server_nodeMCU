<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ESP8266 LED Control</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>🎮 Управление LED</h1>
            <p class="subtitle">ESP8266 веб-интерфейс</p>
            
            <div class="led-card led-1">
                <div class="led-info">
                    <span class="led-icon">💡</span>
                    <h2>LED 1</h2>
                    <p>Встроенный</p>
                </div>
                <div class="led-control">
                    <button class="btn btn-toggle" data-led="1" id="btn1">Включить</button>
                </div>
                <div class="led-status">
                    Статус: <span id="status1" class="status-text">OFF</span>
                </div>
            </div>
            
            <div class="led-card led-2">
                <div class="led-info">
                    <span class="led-icon">🔆</span>
                    <h2>LED 2</h2>
                    <p>Внешний (D1)</p>
                </div>
                <div class="led-control">
                    <button class="btn btn-toggle" data-led="2" id="btn2">Включить</button>
                </div>
                <div class="led-status">
                    Статус: <span id="status2" class="status-text">OFF</span>
                </div>
            </div>
            
            <div class="system-info">
                <h3>📊 Системная информация</h3>
                <p>IP адрес: <span id="ip">загрузка...</span></p>
                <p>Время работы: <span id="uptime">0</span> сек</p>
                <p>Свободная память: <span id="heap">0</span> байт</p>
            </div>
        </div>
    </div>
    
    <script src="assets/js/main.js"></script>
</body>
</html>
